plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.huz.rumange.new"
    compileSdk 34

    defaultConfig {
        applicationId "com.huz.rumange.new"
        minSdkVersion 21
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    flutter {
        source '../..'
    }
}
