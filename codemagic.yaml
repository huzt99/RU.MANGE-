workflows:
  flutter-workflow:
    name: Flutter Workflow
    max_build_duration: 30
    environment:
      flutter: stable
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      
